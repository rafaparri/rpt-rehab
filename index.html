<style>

  .hbtn {
    min-height:50px; min-width:132px; padding:8px 14px; font-size:18px; font-weight:700;

  }

  .badge.pen { background:var(--warn2); color:var(--warn); border:1px solid var(--warn); }
  .badge.cur { background:var(--alt); color:var(--soft); border:1px solid var(--line); }
  details.ses { background:var(--card); border:1px solid var(--line); border-radius:14px; margin:10px 0; padding:0; }
  details.ses > summary { padding:14px; cursor:pointer; list-style:none; }
  details.ses > summary::-webkit-details-marker { display:none; }
  details.ses .cuerpo { padding:0 14px 14px; border-top:1px solid var(--line); }
  table.res { width:100%; border-collapse:collapse; font-size:16px; margin:8px 0; }
  table.res td { padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.res td:first-child { font-weight:600; width:46%; }
  .upd { position:sticky; top:0; z-index:9; background:var(--teal); color:var(--on); padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:17px; font-weight:700; }
  .upd button { min-height:44px; padding:8px 16px; border-radius:10px; border:2px solid var(--on); background:var(--on); color:var(--teal); font-size:17px; font-weight:700; }
  .solo-print { display:none; }
  @media print {
    .top, .tabs, .noprint, .upd, select, label.lab, .pie { display:none !important; }
    .solo-print { display:block; margin-bottom:10px; }
    body { background:#fff; color:#000; font-size:12pt; padding:0; }
    .card, details.ses { border:1px solid #999; break-inside:avoid; }
  }
  .top .wrap > div:first-child { min-width:0; flex:1; }
  .top .quien { word-break:normal; overflow-wrap:anywhere; font-size:13px; }
  .top .acc { display:flex; gap:6px; flex:none; }
  .top .acc .btn { white-space:nowrap; padding:8px 10px; font-size:15px; }
  .pie { text-align:center; margin-top:30px; }
  noscript { display:block; padding:20px; }
  /* ===== v3: diseño en tarjetas ===== */
  :root { --bg:#F3F4FA; --card:#FFFFFF; --ink:#1B1F3B; --soft:#5B6080; --line:#E3E5F0; --teal:#2B2F77; --teal2:#EEF0FF;
    --warn:#C23A26; --warn2:#FFE6E1; --alt:#F3F4FA; --on:#FFFFFF; --ok:#0F6B53; --hd:#2B2F77; --hero:#2B2F77;
    --okbg:#D9F5EB; --okfg:#0B4F3B; --penbg:#FFF1D6; --penfg:#5A3A00; --grbg:#ECEEF6; --grfg:#4A5073;
    --shadow:0 1px 0 rgba(27,31,59,.06),0 10px 24px -14px rgba(27,31,59,.25); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12142B; --card:#1C2040; --ink:#EEF0FF; --soft:#A9AED6; --line:#32376A; --teal:#9AA0FF; --teal2:#272C5C;
      --warn:#FF9C86; --warn2:#3E2320; --alt:#232850; --on:#12142B; --ok:#6FDDB7; --hd:#1C2040; --hero:#2E3480;
      --okbg:#173B31; --okfg:#9BE9CC; --penbg:#3F3213; --penfg:#FFD98A; --grbg:#2A2F5E; --grfg:#B9BEE8; --shadow:none; }
  }
  .top { background:var(--hd); border-bottom:0; color:#fff; }
  .top h1 { color:#fff; font-size:22px; }
  .top .quien { color:#C9CCF5; }
  .top .btn { background:transparent; border-color:#C9CCF5; color:#fff; }
  .card, details.ses { border:0; border-radius:22px; box-shadow:var(--shadow); }
  .btn { border-radius:16px; border-width:2px; }
  .tab { border:0; border-radius:18px; box-shadow:var(--shadow); }
  .tab.on { background:var(--teal); color:var(--on); }
  .badge.rev { background:var(--okbg); color:var(--okfg); border:0; }
  .badge.pen { background:var(--penbg); color:var(--penfg); border:0; }
  .badge.cur { background:var(--grbg); color:var(--grfg); border:0; }
  .ok { background:var(--okbg); color:var(--okfg); border:0; border-radius:16px; }
  .aviso { border:0; border-radius:16px; }
  .chip { border-radius:14px; }
  .chip.f-lo { border-color:var(--ok); } .chip.f-lo.on { background:var(--ok); border-color:var(--ok); color:var(--on); }
  .chip.f-mid { border-color:#B8800A; } .chip.f-mid.on { background:#B8800A; border-color:#B8800A; color:#fff; }
  .chip.f-hi { border-color:var(--warn); } .chip.f-hi.on { background:var(--warn); border-color:var(--warn); color:var(--on); }
  .hero { background:var(--hero); color:#fff; border-radius:26px; padding:20px; display:flex; align-items:center; gap:18px; margin:14px 0; }
  .hero .k { font-size:14px; color:#C9CCF5; } .hero .big { font-size:21px; font-weight:800; line-height:1.2; margin-top:2px; }
  .hero .sub { font-size:15px; color:#E3E5FF; margin-top:6px; }
  .ring { position:relative; width:92px; height:92px; flex:none; }
  .ring span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; }
  .chipfase { display:inline-block; background:var(--card); color:var(--teal); border-radius:999px; padding:6px 14px; font-size:14px; font-weight:800; box-shadow:var(--shadow); }
  .blk { --bk:#2B2F77; --bkt:#EEF0FF; background:var(--card); border-radius:24px; padding:16px; margin:14px 0; box-shadow:var(--shadow); }
  .b-mov { --bk:#946200; --bkt:#FFF3D6; } .b-fue { --bk:#C23A26; --bkt:#FFE6E1; } .b-equ { --bk:#1D6FB8; --bkt:#DFF0FE; } .b-mar { --bk:#0F6B53; --bkt:#D9F5EB; }
  @media (prefers-color-scheme: dark) {
    .blk { --bk:#9AA0FF; --bkt:#272C5C; }
    .b-mov { --bk:#F0B64A; --bkt:#3F3213; } .b-fue { --bk:#FF9C86; --bkt:#3E2320; } .b-equ { --bk:#6DB6F0; --bkt:#14304A; } .b-mar { --bk:#6FDDB7; --bkt:#173B31; }
  }
  .blk-h { display:flex; gap:12px; align-items:center; margin-bottom:12px; }
  .blk-ic { width:46px; height:46px; border-radius:15px; background:var(--bkt); color:var(--bk); display:flex; align-items:center; justify-content:center; flex:none; }
  .blk-t { font-size:20px; font-weight:800; line-height:1.2; }
  .blk .item { background:transparent; border:0; border-top:1px solid var(--line); border-radius:0; padding:12px 0 2px; margin:12px 0 0; }
  .blk .btn { width:100%; border-color:var(--bk); color:var(--bk); background:var(--card); }
  .blk .btn.pri { background:var(--bk); color:var(--on); }
  .blk .hbtn { border-color:var(--bk); color:var(--bk); background:var(--card); }
  .blk .hbtn.on { background:var(--bk); color:var(--on); }
  .blk .serie.hecha { background:var(--bkt); }
  .bnav { position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--card); border-top:1px solid var(--line); padding:8px 12px calc(10px + env(safe-area-inset-bottom)); }
  .bnav .in { max-width:720px; margin:0 auto; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .bnav button { border:0; background:transparent; color:var(--soft); border-radius:16px; min-height:58px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:13px; font-weight:800; }
  .bnav button.on { background:var(--teal2); color:var(--teal); }
  body.pac { padding-bottom:110px; }
</style>

<body>
<noscript>Esta aplicación necesita JavaScript.</noscript>
<div id="app"></div>

<script type="module">
/* ============ Configuración ============ */
const CONFIG = {
  apiKey: "AIzaSyCQrC3JzM_35cageHvh5kiZREaX_GK9Bs4",
  authDomain: "rpt-rehab.firebaseapp.com",
  projectId: "rpt-rehab",
  storageBucket: "rpt-rehab.firebasestorage.app",
  messagingSenderId: "439754311440",
  appId: "1:439754311440:web:2a6ad9137640cd27884795"
};
const COACH_EMAIL = 'rafa.parri@gmail.com';
const VERSION = 'v3.2 · 28 oct 2026';
const FB = '10.12.2';

/* ============ Utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const pad = n => String(n).padStart(2, '0');
const isoFecha = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hoy = () => isoFecha(new Date());
const parseF = f => { const [y, m, d] = f.split('-').map(Number); return new Date(y, m - 1, d); };
const DIAS_CORTO = ['dom','lun','mar','mié','jue','vie','sáb'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fechaCorta = f => { if (!f) return '—'; const d = parseF(f); return DIAS_CORTO[d.getDay()] + ' ' + d.getDate() + ' ' + MESES[d.getMonth()]; };
const fmt = n => String(Math.round(n * 10) / 10).replace('.', ',');
const clonar = o => JSON.parse(JSON.stringify(o));
const ahora = () => new Date().toISOString();

const STEP = { reps: 1, kg: 0.5, seg: 5, m: 50, min: 5 };
const MAX = { reps: 99, kg: 200, seg: 900, m: 3000, min: 240 };
const ZONAS = ['Pies', 'Piernas', 'Muslos', 'Manos', 'Otra zona'];
const CUANDO = ['Durante el ejercicio', 'Al terminar', 'Más tarde'];

/* ============ Estado ============ */
const S = {
  view: 'cargando', B: null, user: null, role: null, enlace: false,
  plan: null, sesiones: [], consent: null,
  semanaId: null, diaId: null, draft: null, tabP: 'hoy', tabC: 'prog', filtro: 'pend',
  msg: '', aviso: '', lastSend: 0, email: store.get('rpt_email') || '', unsub: [], sent: null,
  abiertas: {}, coms: {}, autoT: null, acepto: false, verPass: false, nueva: false, infSem: 'todas', txtCopia: ''
};

/* ============ Backend Firebase ============ */
async function crearBackendFirebase() {
  const base = 'https://www.gstatic.com/firebasejs/' + FB + '/';
  const [appM, authM, fsM] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')
  ]);
  const app = appM.initializeApp(CONFIG);
  // la sesión se guarda de forma permanente (IndexedDB y, si falla, localStorage)
  const auth = authM.initializeAuth(app, { persistence: [authM.indexedDBLocalPersistence, authM.browserLocalPersistence, authM.browserSessionPersistence] });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  const dbx = fsM.getFirestore(app);
  const ref = (c, id) => fsM.doc(dbx, c, id);
  return {
    auth: {
      onChange: cb => authM.onAuthStateChanged(auth, u => cb(u ? { email: (u.email || '').toLowerCase(), verified: u.emailVerified, pass: u.providerData.some(p => p.providerId === 'password') } : null)),
      sendLink: email => authM.sendSignInLinkToEmail(auth, email, { url: location.origin + location.pathname, handleCodeInApp: true }),
      isLink: () => authM.isSignInWithEmailLink(auth, location.href),
      finishLink: email => authM.signInWithEmailLink(auth, email, location.href),
      signInPassword: (email, pw) => authM.signInWithEmailAndPassword(auth, email, pw),
      setPassword: async pw => {
        const u = auth.currentUser;
        try { await authM.linkWithCredential(u, authM.EmailAuthProvider.credential(u.email, pw)); }
        catch (e) { if (e && e.code === 'auth/provider-already-linked') await authM.updatePassword(u, pw); else throw e; }
      },
      signOut: () => authM.signOut(auth)
    },
    db: {
      get: async (c, id) => { const s = await fsM.getDoc(ref(c, id)); return s.exists() ? s.data() : null; },
      set: (c, id, data) => fsM.setDoc(ref(c, id), data),
      update: (c, id, data) => fsM.updateDoc(ref(c, id), data),
      watchDoc: (c, id, cb, err) => fsM.onSnapshot(ref(c, id), s => cb(s.exists() ? s.data() : null), err),
      watchCol: (c, cb, err) => fsM.onSnapshot(fsM.collection(dbx, c), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), err),
      list: async c => { const s = await fsM.getDocs(fsM.collection(dbx, c)); return s.docs.map(d => ({ id: d.id, ...d.data() })); }
    }
  };
}

/* ============ Arranque y acceso ============ */
async function arrancar() {
  try {
    S.B = window.__RPT_BACKEND__ || await crearBackendFirebase();
  } catch (e) {
    S.view = 'error'; return render();
  }
  S.B.auth.onChange(onUser);
  if (S.B.auth.isLink()) {
    S.enlace = true;
    if (S.email) completarEnlace(S.email);
    else { S.view = 'confirmar'; render(); }
  }
}

async function completarEnlace(email) {
  S.view = 'cargando'; render();
  try {
    await S.B.auth.finishLink(email);
    S.email = email; store.set('rpt_email', email);
    history.replaceState(null, '', location.pathname);
  } catch (e) {
    history.replaceState(null, '', location.pathname);
    S.msg = errorAuth(e);
    S.view = 'login';
  }
  S.enlace = false; render();
}

function errorAuth(e) {
  const c = (e && e.code) || '';
  if (c.includes('expired') || c.includes('invalid-action-code')) return 'El enlace ha caducado o ya se usó. Pide uno nuevo.';
  if (c.includes('invalid-email')) return 'El correo no es válido. Revisa que esté bien escrito.';
  if (c.includes('too-many') || c.includes('quota')) return 'Se han pedido demasiados enlaces hoy. Prueba más tarde o avisa a tu entrenador.';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login')) return 'Correo o contraseña incorrectos. Si aún no tienes contraseña, pide el enlace al correo.';
  if (c.includes('weak-password')) return 'La contraseña es demasiado corta (mínimo 8 caracteres).';
  if (c.includes('requires-recent-login')) return 'Por seguridad, entra de nuevo con el enlace del correo y vuelve a crear la contraseña.';
  if (c.includes('operation-not-allowed')) return 'El acceso con contraseña no está activado en Firebase.';
  if (c.includes('network')) return 'Sin conexión. Revisa tu internet e inténtalo de nuevo.';
  return 'No se pudo completar el acceso. Inténtalo de nuevo.';
}

function limpiarSubs() { S.unsub.forEach(f => { try { f(); } catch (e) {} }); S.unsub = []; }

async function onUser(u) {
  limpiarSubs();
  S.user = u; S.plan = null; S.sesiones = []; S.consent = null; S.draft = null; S.semanaId = null; S.diaId = null;
  if (!u) {
    if (S.enlace) return;
    S.view = 'login'; return render();
  }
  S.role = (u.email === COACH_EMAIL) ? 'coach' : 'paciente';
  S.view = 'cargando'; render();
  try {
    S.plan = await S.B.db.get('plan', 'actual');
    S.consent = await S.B.db.get('consentimiento', 'paciente');
  } catch (e) {
    if (e && String(e.code).includes('permission')) { S.view = 'sinacceso'; return render(); }
    S.view = 'error'; return render();
  }
  const errSub = e => { if (e && String(e.code).includes('permission')) { S.view = 'sinacceso'; render(); } };
  S.unsub.push(S.B.db.watchDoc('plan', 'actual', p => { S.plan = p; render(); }, errSub));
  S.unsub.push(S.B.db.watchCol('sesiones', l => {
    S.sesiones = l.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || (b.actualizadaEn || '').localeCompare(a.actualizadaEn || ''));
    render();
  }, errSub));
  if (S.role === 'coach') S.view = 'coach';
  else S.view = S.consent ? 'paciente' : 'consent';
  render();
}

/* ============ Semanas, estados y bloqueo ============ */
const SEMS = () => (S.plan && Array.isArray(S.plan.semanas)) ? S.plan.semanas : [];
const planAntiguo = () => !!(S.plan && !Array.isArray(S.plan.semanas));
const keyDe = (semId, diaId) => semId + '_' + diaId;
const sesDe = (semId, diaId) => S.sesiones.find(s => s.id === keyDe(semId, diaId)) || null;
const itemsDe = dia => dia.bloques.flatMap(b => b.items);

// Estado de un día: SIN REALIZAR (no enviado), SIN REVISAR (enviado), REVISADA
function estadoDia(semId, diaId) {
  const s = sesDe(semId, diaId);
  if (!s || s.estado === 'en_curso') return 'sin_realizar';
  return s.revisado ? 'revisada' : 'sin_revisar';
}
function resumenSemana(w) {
  const n = w.dias.length; let env = 0, rev = 0, curso = 0;
  w.dias.forEach(d => {
    const e = estadoDia(w.id, d.id);
    if (e !== 'sin_realizar') env++;
    if (e === 'revisada') rev++;
    const s = sesDe(w.id, d.id); if (s && s.estado === 'en_curso') curso++;
  });
  const estado = (n > 0 && rev === n) ? 'revisada' : ((n > 0 && env === n) ? 'sin_revisar' : 'sin_realizar');
  return { n, env, rev, curso, estado };
}
// Bloque = grupo de semanas (Fase 1, Fase 2...). Mario accede a todas las semanas de su bloque;
// un bloque se abre cuando TODAS las semanas de los bloques anteriores están REVISADAS
function desbloqueada(i) {
  const ws = SEMS();
  for (let k = 0; k < i; k++) if ((ws[k].grupo || '') !== (ws[i].grupo || '') && resumenSemana(ws[k]).estado !== 'revisada') return false;
  return true;
}
function badgeEstado(e) {
  if (e === 'revisada') return '<span class="badge rev">REVISADA</span>';
  if (e === 'sin_revisar') return '<span class="badge pen">SIN REVISAR</span>';
  return '<span class="badge cur">SIN REALIZAR</span>';
}

function semanaSel() {
  const ws = SEMS();
  if (!ws.length) return null;
  let i = ws.findIndex(w => w.id === S.semanaId);
  if (i >= 0 && ws[i].archivada) i = -1;
  if (i < 0) {
    i = ws.findIndex((w, k) => !w.archivada && desbloqueada(k) && resumenSemana(w).estado === 'sin_realizar');
    if (i < 0) { i = 0; ws.forEach((w, k) => { if (!w.archivada && desbloqueada(k)) i = k; }); }
    S.semanaId = ws[i].id; S.diaId = null;
  }
  return { w: ws[i], i, abierta: desbloqueada(i) };
}
function diaSel(w) {
  if (!S.diaId || !w.dias.some(d => d.id === S.diaId)) {
    const pend = w.dias.find(d => estadoDia(w.id, d.id) === 'sin_realizar');
    S.diaId = (pend || w.dias[0]).id;
  }
  return w.dias.find(d => d.id === S.diaId);
}

/* ============ Borrador (paciente) ============ */
function nuevoDraft(sem, dia, key) {
  const ej = {};
  itemsDe(dia).forEach(it => {
    const sets = [];
    for (let i = 0; i < (it.series || 1); i++) {
      const s = { hecho: false };
      if (it.tipo === 'fuerza') { s.reps = it.obj || 0; s.kg = it.kg || 0; }
      if (it.tipo === 'tiempo') s.seg = it.obj || 0;
      if (it.tipo === 'marcha') s.m = it.obj || 0;
      sets.push(s);
    }
    ej[it.id] = { n: it.n, tipo: it.tipo, sets };
  });
  return {
    key, fecha: hoy(), semanaId: sem.id, semanaN: SEMS().findIndex(x => x.id === sem.id) + 1,
    diaId: dia.id, diaN: dia.n, diaT: dia.t, ej,
    fatiga: null, dolor: { hay: null, zona: '' }, entum: { hay: null, zonas: [], cuando: '', min: 0 },
    notas: '', revisado: false, comentario: ''
  };
}

function prepararDraft(sem, dia) {
  const key = keyDe(sem.id, dia.id);
  const ya = S.sesiones.find(x => x.id === key);
  if (!S.draft || S.draft.key !== key) {
    if (ya) { S.draft = clonar(ya); S.draft.key = key; }
    else {
      let loc = null;
      try { loc = JSON.parse(store.get('rpt_draft_' + key) || 'null'); } catch (e) {}
      S.draft = loc && loc.key === key ? loc : nuevoDraft(sem, dia, key);
    }
  }
  if (ya) { S.draft.revisado = !!ya.revisado; S.draft.comentario = ya.comentario || ''; S.draft.enviada = ya.estado !== 'en_curso'; S.draft.enviadaEn = ya.enviadaEn || null; }
  return S.draft;
}

function guardarLocal() {
  if (S.draft && !S.draft.revisado) { store.set('rpt_draft_' + S.draft.key, JSON.stringify(S.draft)); programarAuto(); }
}
// Guardado en vivo: cada cambio se manda al servidor 1,5 s después (así el entrenador ve la sesión "en curso")
function programarAuto() { clearTimeout(S.autoT); S.autoT = setTimeout(autoguardar, 1500); }
function flushAuto() { if (S.autoT) { clearTimeout(S.autoT); S.autoT = null; autoguardar(); } }
async function autoguardar() {
  S.autoT = null;
  const d = S.draft;
  if (!d || d.revisado || !S.B || S.role !== 'paciente') return;
  try { await S.B.db.set('sesiones', d.key, docDesdeDraft(d, d.enviada ? 'enviada' : 'en_curso')); } catch (e) { /* se reintenta en el siguiente cambio */ }
}
function docDesdeDraft(d, estado) {
  const c = contar(d.ej);
  return {
    fecha: d.fecha, semanaId: d.semanaId, semanaN: d.semanaN, diaId: d.diaId, diaN: d.diaN, diaT: d.diaT, ej: d.ej, estado,
    fatiga: d.fatiga == null ? null : d.fatiga,
    dolor: d.dolor.hay === true ? { hay: true, zona: (d.dolor.zona || '').slice(0, 200) } : { hay: d.dolor.hay, zona: '' },
    entum: d.entum.hay === true ? { hay: true, zonas: d.entum.zonas, cuando: d.entum.cuando || '', min: d.entum.min || 0 } : { hay: d.entum.hay, zonas: [], cuando: '', min: 0 },
    notas: (d.notas || '').slice(0, 2000), resumen: { hechas: c.h, total: c.t },
    enviadaEn: estado === 'enviada' ? (d.enviadaEn || ahora()) : (d.enviadaEn || null),
    actualizadaEn: ahora(), revisado: false, comentario: ''
  };
}

function contar(ej) {
  let t = 0, h = 0;
  Object.values(ej || {}).forEach(e => (e.sets || []).forEach(s => { t++; if (s.hecho) h++; }));
  return { t, h };
}

    h += `<div class="lab">¿Cuántos minutos duró?</div><div class="steps" style="margin-bottom:12px"><div class="ctl"><button type="button" data-act="entmin" data-d="-1" aria-label="Menos minutos">−</button><output>${d.entum.min}<small>min</small></output><button type="button" data-act="entmin" data-d="1" aria-label="Más minutos">+</button></div></div>`;
    h += `<div class="aviso" style="font-size:16px">Si dura más de una hora, sube por el muslo o la ingle, o notas debilidad nueva, deja de entrenar y consulta con un médico.</div>`;

}

/* ----- Entrenador ----- */
function objetivo(it) {
  const n = it.series || 1;
  if (it.tipo === 'fuerza') return n + ' × ' + (it.obj || '?') + ' rep' + (it.kg ? ' · ' + fmt(it.kg) + ' kg' : '');
  if (it.tipo === 'tiempo') return n + ' × ' + (it.obj || '?') + ' s';
  if (it.tipo === 'marcha') return n + ' × ' + (it.obj || '?') + ' m';
  return n > 1 ? n + ' series' : '1 vez';
}

function tarjetaImportar() {

/* ----- Informes y evolución ----- */
const ordenFecha = (a, b) => (a.fecha || '').localeCompare(b.fecha || '') || (a.enviadaEn || '').localeCompare(b.enviadaEn || '');
function sesInforme() {
  let l = S.sesiones.filter(s => s.estado !== 'en_curso');
  if (S.infSem !== 'todas') l = l.filter(s => s.semanaId === S.infSem);
  return l.sort(ordenFecha);
}
function mejorSet(e) {
  const hs = (e.sets || []).filter(x => x.hecho);
  if (e.tipo === 'fuerza') {
    let m = null;
    hs.forEach(x => { const kg = x.kg || 0, rp = x.reps || 0; if (!m || kg > m.kg || (kg === m.kg && rp > m.reps)) m = { kg, reps: rp }; });
    return m;
  }
  if (e.tipo === 'tiempo') return hs.length ? { seg: Math.max(...hs.map(x => x.seg || 0)) } : null;
  if (e.tipo === 'marcha') return hs.length ? { m: Math.max(...hs.map(x => x.m || 0)) } : null;
  return { h: hs.length, t: (e.sets || []).length };
}
function txtMejor(tipo, m) {
  if (!m) return '—';
  if (tipo === 'fuerza') return m.reps + ' rep' + (m.kg ? ' · ' + fmt(m.kg) + ' kg' : '');
  if (tipo === 'tiempo') return m.seg + ' s';
  if (tipo === 'marcha') return m.m + ' m';
  return m.h + '/' + m.t;
}
function puntosMejor(tipo, m) {
  if (!m) return 0;
  if (tipo === 'fuerza') return m.kg * 1000 + m.reps;
  if (tipo === 'tiempo') return m.seg;
  if (tipo === 'marcha') return m.m;
  return m.h;
}
function evolEjercicios(l) {
  const mp = new Map();
  l.forEach(s => Object.values(s.ej || {}).forEach(e => {
    if (!mp.has(e.n)) mp.set(e.n, { n: e.n, tipo: e.tipo, v: [] });
    mp.get(e.n).v.push({ f: s.fecha, m: mejorSet(e) });
  }));
  return [...mp.values()];
}
function statsInforme(l) {
  let t = 0, h = 0, dolor = 0, entum = 0, entMax = 0; const fs = [];
  l.forEach(s => {
    const c = contar(s.ej); t += c.t; h += c.h;
    if (s.fatiga != null) fs.push(s.fatiga);
    if (s.dolor && s.dolor.hay) dolor++;
    if (s.entum && s.entum.hay) { entum++; entMax = Math.max(entMax, s.entum.min || 0); }
  });
  return { n: l.length, t, h, adh: t ? Math.round(h / t * 100) : 0, fm: fs.length ? fs.reduce((a, b) => a + b, 0) / fs.length : 0, fmax: fs.length ? Math.max(...fs) : 0, dolor, entum, entMax };
}
// Orientación prudente para el entrenador; la decisión es siempre suya
function semaforo(st) {
  if (!st.n) return null;
  if (st.dolor || st.entMax >= 60 || st.fm >= 8 || st.adh < 60) {
    const m = [st.dolor ? 'dolor nuevo' : '', st.entMax >= 60 ? 'entumecimiento de 60 min o más' : '', st.fm >= 8 ? 'cansancio medio muy alto' : '', st.adh < 60 ? 'pocas series completadas' : ''].filter(Boolean).join(', ');
    return { c: 'pen', t: 'Revisar o reducir', d: 'Conviene valorarlo antes de subir carga: ' + m + '.' };
  }
  if (st.fm >= 6.5 || st.entum || st.adh < 85) return { c: 'cur', t: 'Mantener', d: 'Repetir la carga actual hasta que el cansancio baje y complete casi todo.' };
  return { c: 'rev', t: 'Posible progresión', d: 'Completa casi todo, con cansancio moderado y sin dolor ni entumecimiento. Se puede plantear subir algo (carga, repeticiones o dificultad del equilibrio).' };
}
function graficaLinea(pts, max, titulo) {
  if (!pts.length) return '';
  const W = 340, H = 150, L = 32, R = 10, T = 12, B = 26, pw = W - L - R, ph = H - T - B;
  const x = i => L + (pts.length === 1 ? pw / 2 : pw * i / (pts.length - 1));
  const y = v => T + ph - ph * Math.min(v, max) / max;
  let g = '';
  [0, 0.5, 1].forEach(f => {
    const v = max * f;
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" style="stroke:var(--line)"/><text x="${L - 4}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" style="fill:var(--soft)">${Math.round(v)}</text>`;
  });
  const d = pts.map((q, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(q.y).toFixed(1)).join(' ');
  g += `<path d="${d}" fill="none" stroke-width="3" style="stroke:var(--teal)"/>`;
  pts.forEach((q, i) => { g += `<circle cx="${x(i).toFixed(1)}" cy="${y(q.y).toFixed(1)}" r="4.5" style="fill:var(--teal)"/>`; });
  g += `<text x="${L}" y="${H - 6}" font-size="11" style="fill:var(--soft)">${esc(pts[0].x)}</text>`;
  if (pts.length > 1) g += `<text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="11" style="fill:var(--soft)">${esc(pts[pts.length - 1].x)}</text>`;
  return `<h3 style="margin-top:14px">${esc(titulo)}</h3><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(titulo)}">${g}</svg>`;
}
function periodoTxt() {
  return S.infSem === 'todas' ? 'todo el entrenamiento' : 'semana ' + (SEMS().findIndex(w => w.id === S.infSem) + 1);
}
function textoParaClaude() {
  const l = sesInforme(), st = statsInforme(l);
  let t = `INFORME DE EVOLUCIÓN (${periodoTxt()}) — paciente con CMT tipo 1, 20 años, usa andador, marcha en steppage, dedos en garra, miedo a caer.\n`;
  t += `Sesiones: ${st.n} · Series hechas: ${st.h}/${st.t} (${st.adh}%) · Cansancio medio: ${fmt(st.fm)}/10 (máx ${st.fmax}) · Sesiones con dolor nuevo: ${st.dolor} · Con entumecimiento: ${st.entum} (máx ${st.entMax} min)\n\n`;
  l.forEach(s => {
    const c = contar(s.ej);
    t += `- Semana ${numSemana(s)} ${s.diaN || ''} (${s.fecha}): ${c.h}/${c.t} series, cansancio ${s.fatiga ?? '?'}/10, dolor: ${s.dolor && s.dolor.hay ? 'SÍ ' + (s.dolor.zona || '') : 'no'}, entumecimiento: ${s.entum && s.entum.hay ? 'SÍ ' + (s.entum.zonas || []).join('/') + ' ' + (s.entum.cuando || '') + ' ' + (s.entum.min || 0) + ' min' : 'no'}${s.notas ? ', notas: ' + s.notas : ''}${s.comentario ? ', comentario del entrenador: ' + s.comentario : ''}\n`;
    Object.values(s.ej || {}).forEach(e => { t += `    · ${e.n}: ${txtMejor(e.tipo, mejorSet(e))}\n`; });
  });
  return t;
}

  if (S.tabC === 'prog') h += vistaProgramacion();
  if (S.tabC === 'inf') h += vistaInformes();

  if (S.tabC === 'sesiones') {
    h += `<div class="chips">` + [['pend', 'Sin revisar'], ['curso', 'En curso'], ['rev', 'Revisadas'], ['todas', 'Todas']].map(([v, t]) => `<button type="button" class="chip ${S.filtro === v ? 'on' : ''}" data-act="filtro" data-v="${v}">${t}</button>`).join('') + `</div>`;
    const l = S.sesiones.filter(s => S.filtro === 'todas' || (S.filtro === 'curso' ? s.estado === 'en_curso' : (S.filtro === 'rev' ? (s.estado !== 'en_curso' && s.revisado) : (s.estado !== 'en_curso' && !s.revisado))));
    if (!l.length) h += `<div class="card">${S.sesiones.length ? 'No hay informes en esta lista.' : 'Todavía no hay informes.'}</div>`;
    l.forEach(s => {
      const enCurso = s.estado === 'en_curso';
      h += `<details class="ses" data-id="${esc(s.id)}" ${S.abiertas[s.id] ? 'open' : ''}><summary>${cabSesion(s)}</summary><div class="cuerpo">${detalleSesion({ ...s, comentario: '' })}`;
      if (enCurso) h += `<div class="aviso" style="font-size:16px">Está en curso: aún no ha pulsado "Enviar". Podrás revisarla cuando la envíe.</div>`;
      else h += `<label class="lab" for="com_${esc(s.id)}">Tu comentario para el paciente</label>
        <textarea id="com_${esc(s.id)}" maxlength="1000">${esc(S.coms[s.id] !== undefined ? S.coms[s.id] : (s.comentario || ''))}</textarea><div style="height:10px"></div>
        ${s.revisado ? `<button type="button" class="btn" data-act="reabrir" data-id="${esc(s.id)}">Reabrir para que pueda corregir</button><div style="height:8px"></div><button type="button" class="btn" data-act="revisar" data-id="${esc(s.id)}">Guardar comentario</button>`
          : `<button type="button" class="btn pri" data-act="revisar" data-id="${esc(s.id)}">Marcar como revisada</button>`}`;
      h += `</div></details>`;
    });
  }

  if (S.tabC === 'copia') {
    h += `<div class="card"><h3>Copia de seguridad</h3><p class="soft">Descarga todo (plan, informes y consentimiento) en un archivo.</p><button type="button" class="btn pri" data-act="backup">Descargar copia</button></div>
    <div class="card"><h3>Consentimiento del paciente</h3><p>${S.consent ? 'Firmado el ' + esc((S.consent.fecha || '').slice(0, 10)) : 'Aún no lo ha firmado.'}</p></div>`;
  }
  return h + `<p class="pie small">${VERSION}</p></div>`;
}

/* ============ Render ============ */
function render() {
  const y = window.scrollY;
  const v = S.view;
  let h;
  if (v === 'login') h = vistaLogin();
  else if (v === 'confirmar') h = vistaConfirmar();
  else if (v === 'sinacceso') h = vistaSinAcceso();
  else if (v === 'error') h = vistaError();
  else if (v === 'consent') h = vistaConsent();
  else if (v === 'paciente') h = vistaPaciente();
  else if (v === 'coach') h = vistaCoach();
  else h = '<div class="wrap"><p class="soft" style="margin-top:40px">Cargando…</p></div>';
  if (S.nueva && v !== 'cargando') h = '<div class="upd"><span>Hay una versión nueva</span><button type="button" data-act="actualizar">Actualizar</button></div>' + h;
  document.body.classList.toggle('pac', v === 'paciente');
  $('#app').innerHTML = h;
  window.scrollTo(0, y);
}

/* ============ Acciones ============ */
function toast(m) { S.msg = m; render(); setTimeout(() => { if (S.msg === m) { S.msg = ''; render(); } }, 4000); }

async function enviarSesion() {
  const d = S.draft;
  const falta = [];
  if (d.fatiga == null) falta.push('cansancio');
  if (d.dolor.hay == null) falta.push('dolor nuevo');
  if (d.entum.hay == null) falta.push('entumecimiento');
  if (falta.length) { S.aviso = 'Falta responder: ' + falta.join(', ') + '.'; render(); const a = $('#aviso'); if (a) a.scrollIntoView({ block: 'center' }); return; }
  S.aviso = '';
  clearTimeout(S.autoT); S.autoT = null;
  const doc = docDesdeDraft(d, 'enviada');
  try {
    await S.B.db.set('sesiones', d.key, doc);
    store.del('rpt_draft_' + d.key);
    d.enviada = true; d.enviadaEn = doc.enviadaEn;
    toastPac('Enviado al entrenador ✓');
  } catch (e) {
    S.aviso = 'No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.'; render();
  }
}
function toastPac(m) { S.aviso = ''; S.msg = m; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => { if (S.msg === m) { S.msg = ''; render(); } }, 4000); }

async function importarPlan(file) {
  try {
    const plan = JSON.parse(await file.text());
    if (!plan || !Array.isArray(plan.semanas) || !plan.semanas.length) throw new Error('semanas');
    const idsSem = new Set();
    plan.semanas.forEach(w => {
      if (!w.id || idsSem.has(w.id) || !Array.isArray(w.dias) || !w.dias.length) throw new Error('semana ' + (w.id || '?'));
      idsSem.add(w.id);
      w.dias.forEach(d => {
        if (!d.id || !Array.isArray(d.bloques)) throw new Error('bloques');
        const ids = new Set();
        d.bloques.forEach(b => b.items.forEach(it => {
          if (!it.id || !it.n || !it.tipo) throw new Error('ejercicio');
          if (ids.has(it.id)) throw new Error('repetido ' + it.id);
          ids.add(it.id);
        }));
      });
    });
    if (!confirm('¿Cargar este plan? Sustituye al plan actual.')) return;
    plan.actualizado = ahora();
    await S.B.db.set('plan', 'actual', plan);
    toast('Plan cargado ✓');
  } catch (e) {
    toast('El archivo no es un plan válido (' + (e.message || 'error') + ').');
  }
}

async function ampliarSemana(id) {
  if (!confirm('¿Añadir una semana más, igual que esta, justo después?')) return;
  try {
    const sem = clonar(S.plan.semanas), i = sem.findIndex(w => w.id === id);
    if (i < 0) return;
    const raiz = sem[i].raiz || sem[i].id;
    const extras = sem.filter(w => w.raiz === raiz).length;
    const nueva = clonar(sem[i]);
    nueva.id = raiz + 'x' + (extras + 1); nueva.raiz = raiz; nueva.ampliada = true; delete nueva.archivada;
    let pos = i; sem.forEach((w, k) => { if (w.id === raiz || w.raiz === raiz) pos = Math.max(pos, k); });
    sem.splice(pos + 1, 0, nueva);
    await S.B.db.update('plan', 'actual', { semanas: sem });
    toast('Semana añadida ✓');
  } catch (e) { toast('No se pudo añadir la semana.'); }
}

async function quitarSemana(id) {
  if (S.sesiones.some(s => s.semanaId === id)) { toast('Esa semana ya tiene informes y no se puede quitar.'); return; }
  if (!confirm('¿Quitar esta semana añadida?')) return;
  try {
    await S.B.db.update('plan', 'actual', { semanas: S.plan.semanas.filter(w => w.id !== id) });
    toast('Semana quitada ✓');
  } catch (e) { toast('No se pudo quitar la semana.'); }
}

async function archivarSemana(id, valor) {
  try {
    const sem = clonar(S.plan.semanas), w = sem.find(x => x.id === id);
    if (!w) return;
    if (valor && resumenSemana(w).estado !== 'revisada') { toast('Solo se puede archivar una semana revisada.'); return; }
    if (valor) w.archivada = true; else delete w.archivada;
    await S.B.db.update('plan', 'actual', { semanas: sem });
    toast(valor ? 'Semana archivada ✓' : 'Semana desarchivada ✓');
  } catch (e) { toast('No se pudo cambiar.'); }
}

async function copiarInforme() {
  const t = textoParaClaude();
  try { await navigator.clipboard.writeText(t); S.txtCopia = ''; toast('Resumen copiado ✓ Pégalo en el chat con Claude'); }
  catch (e) { S.txtCopia = t; render(); }
}

async function copiaSeguridad() {
  try {
    const [ses, plan, cons] = await Promise.all([S.B.db.list('sesiones'), S.B.db.get('plan', 'actual'), S.B.db.get('consentimiento', 'paciente')]);
    const blob = new Blob([JSON.stringify({ exportado: ahora(), plan, consentimiento: cons, sesiones: ses }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'rpt-rehab-copia-' + hoy() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Copia descargada ✓');
  } catch (e) { toast('No se pudo descargar la copia.'); }
}

/* ============ Eventos ============ */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, d = S.draft;
  switch (act) {
    case 'enviarenlace': {
      const em = ($('#email').value || '').trim().toLowerCase();
      if (!em || !em.includes('@')) { S.msg = 'Escribe tu correo completo.'; S.email = em; return render(); }
      if (Date.now() - S.lastSend < 30000) { S.msg = 'Espera unos segundos antes de pedir otro enlace.'; return render(); }
      S.email = em; S.lastSend = Date.now(); S.msg = '';
      try { await S.B.auth.sendLink(em); store.set('rpt_email', em); S.sent = em; }
      catch (e) { S.msg = errorAuth(e); }
      return render();
    }
    case 'entrarpass': {
      const em = ($('#email').value || '').trim().toLowerCase(), pw = $('#pass').value || '';
      if (!em || !em.includes('@') || !pw) { S.msg = 'Escribe tu correo y tu contraseña.'; S.email = em; return render(); }
      S.email = em; S.msg = '';
      try { await S.B.auth.signInPassword(em, pw); store.set('rpt_email', em); }
      catch (e) { S.msg = errorAuth(e); render(); }
      return;
    }
    case 'verpass': S.verPass = !S.verPass; render(); if (S.verPass) { const n = $('#newpass'); if (n) n.scrollIntoView({ block: 'center' }); } return;
    case 'crearpass': {
      const pw = ($('#newpass').value || '');
      if (pw.length < 8) { toast('La contraseña debe tener al menos 8 caracteres.'); return; }
      try { await S.B.auth.setPassword(pw); store.set('rpt_pass_' + S.user.email, '1'); S.verPass = false; toast('Contraseña guardada ✓ Ya puedes entrar con ella'); }
      catch (e) { toast(errorAuth(e)); }
      return;
    }
    case 'confirmaremail': {
      const em = ($('#email').value || '').trim().toLowerCase();
      if (em) completarEnlace(em);
      return;
    }
    case 'salir': S.sent = null; S.msg = ''; try { await S.B.auth.signOut(); } catch (e) {} return;
    case 'recargar': return location.reload();
    case 'actualizar': { flushAuto(); setTimeout(() => location.replace(location.pathname + '?v=' + Date.now()), 300); return; }
    case 'aceptar': {
      if (!$('#acepto').checked) { S.msg = 'Marca la casilla para continuar.'; S.view = 'consent'; return render(); }
      try {
        const c = { acepta: true, version: 1, fecha: ahora() };
        await S.B.db.set('consentimiento', 'paciente', c);
        S.consent = c; S.view = 'paciente'; S.msg = '';
      } catch (e) { S.msg = 'No se pudo guardar. Inténtalo de nuevo.'; }
      return render();
    }
    case 'tabp': S.tabP = v; return render();
    case 'tabc': S.tabC = v; S.msg = ''; return render();
    case 'filtro': S.filtro = v; return render();
    case 'sem': flushAuto(); S.semanaId = v; S.diaId = null; S.draft = null; S.aviso = ''; return render();
    case 'dia': flushAuto(); S.diaId = v; S.draft = null; S.aviso = ''; return render();
    case 'step': {
      const s = d.ej[b.dataset.ej].sets[+b.dataset.i], c = b.dataset.campo;
      s[c] = Math.max(0, Math.min(MAX[c], Math.round(((s[c] || 0) + (+b.dataset.d) * STEP[c]) * 10) / 10));
      guardarLocal(); return render();
    }
    case 'hecho': { const s = d.ej[b.dataset.ej].sets[+b.dataset.i]; s.hecho = !s.hecho; guardarLocal(); return render(); }
    case 'bloque': {
      const dia = diaSel(semanaSel().w), bl = dia.bloques[+b.dataset.b];
      const sets = bl.items.flatMap(it => (d.ej[it.id] ? d.ej[it.id].sets : []));
      const marcar = !sets.every(s => s.hecho);
      sets.forEach(s => { s.hecho = marcar; });
      guardarLocal(); return render();
    }
    case 'fatiga': d.fatiga = +v; S.aviso = ''; guardarLocal(); return render();
    case 'dolor': d.dolor.hay = (v === 'si'); S.aviso = ''; guardarLocal(); return render();
    case 'entum': d.entum.hay = (v === 'si'); S.aviso = ''; guardarLocal(); return render();
    case 'zona': { const z = d.entum.zonas, i = z.indexOf(v); if (i >= 0) z.splice(i, 1); else z.push(v); guardarLocal(); return render(); }
    case 'cuando': d.entum.cuando = (d.entum.cuando === v ? '' : v); guardarLocal(); return render();
    case 'entmin': d.entum.min = Math.max(0, Math.min(MAX.min, (d.entum.min || 0) + (+b.dataset.d) * STEP.min)); guardarLocal(); return render();
    case 'enviar': return enviarSesion();
    case 'revisar': {
      const id = b.dataset.id, ta = document.getElementById('com_' + id);
      try { await S.B.db.update('sesiones', id, { revisado: true, comentario: (ta ? ta.value : '').slice(0, 1000), revisadaEn: ahora() }); delete S.coms[id]; toast('Sesión revisada ✓'); }
      catch (e) { toast('No se pudo guardar.'); }
      return;
    }
    case 'reabrir': {
      try { await S.B.db.update('sesiones', b.dataset.id, { revisado: false }); toast('Sesión reabierta ✓'); }
      catch (e) { toast('No se pudo reabrir.'); }
      return;
    }
    case 'verses': {
      const id = b.dataset.id;
      S.tabC = 'sesiones'; S.filtro = 'todas'; S.abiertas[id] = true; render();
      setTimeout(() => { const el = document.querySelector('details.ses[data-id="' + id.replace(/"/g, '') + '"]'); if (el) el.scrollIntoView({ block: 'start' }); }, 50);
      return;
    }
    case 'ampliar': return ampliarSemana(b.dataset.id);
    case 'quitarsem': return quitarSemana(b.dataset.id);
    case 'archivar': return archivarSemana(b.dataset.id, true);
    case 'desarchivar': return archivarSemana(b.dataset.id, false);
    case 'imprimir': return window.print();
    case 'copiarinf': return copiarInforme();
    case 'backup': return copiaSeguridad();
  }
});

// recordar qué desplegables tiene abiertos el entrenador (los avisos en tiempo real no deben cerrarlos)
document.addEventListener('toggle', ev => {
  const t = ev.target;
  if (t.tagName === 'DETAILS' && t.dataset.id) S.abiertas[t.dataset.id] = t.open;
}, true);

document.addEventListener('input', ev => {
  const t = ev.target, d = S.draft;
  if (t.id && t.id.startsWith('com_')) S.coms[t.id.slice(4)] = t.value;
  if (!d) return;
  if (t.id === 'notas') { d.notas = t.value; guardarLocal(); }
  if (t.id === 'dolorzona') { d.dolor.zona = t.value; guardarLocal(); }
});

document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'acepto') S.acepto = t.checked;
  if (t.id === 'infsem') { S.infSem = t.value; S.txtCopia = ''; render(); }
  if (t.id === 'fecha' && t.value && S.draft) { S.draft.fecha = t.value; guardarLocal(); }
  if (t.id === 'planfile' && t.files && t.files[0]) importarPlan(t.files[0]);
});

// Aviso de versión nueva: compara con version.json (siempre sin caché)
async function buscarVersion() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (j && j.v && j.v !== VERSION && !S.nueva) { S.nueva = true; render(); }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) buscarVersion(); });
setInterval(buscarVersion, 5 * 60 * 1000);
buscarVersion();

arrancar();
</script>
